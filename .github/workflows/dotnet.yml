name: .NET build

on:
  push:
    branches: [main, experiment/net11-modernization]
  pull_request:
    branches: [main, experiment/net11-modernization]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET 10 SDK
        if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name != 'pull_request' && github.ref_name == 'main') }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga
      - name: Setup .NET 11 preview SDK
        if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'experiment/net11-modernization') || (github.event_name != 'pull_request' && github.ref_name == 'experiment/net11-modernization') }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview
      - name: Restore
        run: dotnet restore Project/WinHubX.sln
      - name: Build
        run: dotnet build Project/WinHubX.sln --configuration Release --no-restore -warnaserror --nologo
      - name: Test
        run: dotnet test Project/WinHubX.sln --configuration Release --no-build --no-restore --nologo
      - name: Dependency audit
        run: dotnet list Project/WinHubX/WinHubX.csproj package --vulnerable --include-transitive
      - name: Publish artifact
        run: dotnet publish Project/WinHubX/WinHubX.csproj --configuration Release --no-restore --output artifacts/WinHubX
      - uses: actions/upload-artifact@v7
        with:
          name: WinHubX
          path: artifacts/WinHubX
