name: Signed WinHubX release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      CERT_PASSWORD: ${{ secrets.WINHUBX_SIGNING_CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Project/WinHubX/WinHubX.csproj

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Project/WinHubX/WinHubX.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            --nologo

      - name: Import signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINHUBX_SIGNING_CERT_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)) {
            throw 'Signing secrets are required for a signed release.'
          }
          [IO.File]::WriteAllBytes(
            "$env:RUNNER_TEMP\winhubx-signing.pfx",
            [Convert]::FromBase64String($env:CERT_BASE64))

      - name: Sign and verify executable
        shell: pwsh
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
          $exe = (Resolve-Path 'artifacts/publish/WinHubX.exe').Path
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f "$env:RUNNER_TEMP\winhubx-signing.pfx" /p "$env:CERT_PASSWORD" $exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          & $signtool verify /pa /all $exe
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode verification failed.' }

      - name: Package signed release
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $zip = "artifacts/WinHubX-$version-win-x64.zip"
          Compress-Archive -Path 'artifacts/publish/*' -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash | Set-Content "$zip.sha256" -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.sha256
